<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolesa Pattern</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22 viewBox=%22-104 -104 208 208%22 fill=%22none%22%3E%3Cpath d=%22M-47 0A47 47 0 0 0 47 0Z%22 fill=%22%23005EFF%22/%3E%3Cpath d=%22M-60 0A60 60 0 0 1 60 0 M-87.5 0A87.5 87.5 0 0 0 87.5 0%22 stroke=%22%23005EFF%22 stroke-width=%2229%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds/kds.css?v=__V__">
<link rel="stylesheet" href="style.css?v=__V__">
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="head">
      <h1 data-t="title"></h1>
      <div class="headTools">
        <select class="kds-input langSel" id="langs" aria-label="Language"></select>
        <button class="kds-btn kds-btn--ghost kds-btn--size-icon-sm" id="themeBtn" data-t-aria="theme"><i data-icon="sun"></i></button>
      </div>
    </header>
    <button class="kds-btn kds-btn--outline kds-btn--size-sm wide" id="resetTop"><i data-icon="update"></i><span data-t="resetAll"></span></button>

    <section>
      <div class="secHead"><h2 data-t="variant"></h2>
        <button class="kds-btn kds-btn--ghost kds-btn--size-icon-sm" id="addPreset" data-t-aria="addPreset"><i data-icon="add-plus"></i></button>
      </div>
      <div class="presetGrid" id="variants"></div>
    </section>

    <section>
      <h2 data-t="format"></h2>
      <div class="ratioRow">
        <label class="kds-label" for="ratio" data-t="ratio"></label>
        <input type="range" id="ratio" min="0" max="6" step="any">
        <span class="ratioOut"><span class="ratioIcon" id="ratioIcon" aria-hidden="true"><i></i></span><span class="ratioText" id="ratioText"></span></span>
      </div>
      <div class="row2">
        <div class="kds-field"><label class="kds-label" for="width" data-t="width"></label><input class="kds-input" type="number" id="width" min="16" max="20000" data-unit="px"></div>
        <div class="kds-field"><label class="kds-label" for="height" data-t="height"></label><input class="kds-input" type="number" id="height" min="16" max="20000" data-unit="px"></div>
      </div>
    </section>

    <section>
      <div class="secHead"><h2 data-t="geometry"></h2><button class="kds-btn kds-btn--ghost kds-btn--size-icon-sm" id="resetGeom" data-t-aria="resetGeomTip"><i data-icon="update"></i></button></div>
      <div id="geomSliders"></div>
      <label class="check"><input type="checkbox" role="switch" class="switch" id="linkTS"><span><span data-t="linkTS"></span> <span class="unit" id="tsRatioText"></span></span></label>
      <label class="check"><input type="checkbox" role="switch" class="switch" id="shiftOn"><span data-t="shift"></span></label>
      <label class="check"><input type="checkbox" role="switch" class="switch" id="core"><span data-t="core"></span></label>
      <label class="check"><input type="checkbox" role="switch" class="switch" id="variation"><span data-t="variation"></span></label>
      <label class="check"><input type="checkbox" role="switch" class="switch" id="threeD"><span data-t="threeD"></span></label>
      <details>
        <summary data-t="advanced"></summary>
        <div id="advSliders"></div>
      </details>
    </section>

    <section id="cameraSec" class="cameraSec">
      <div class="titleTip"><h2 data-t="camera"></h2><span class="helpTip helpTip--wide" tabindex="0"><i data-icon="question-round"></i><span class="tip" role="tooltip"><ul class="keys" id="camKeys"></ul></span></span></div>
      <div id="camSliders"></div>
      <button class="kds-btn kds-btn--outline kds-btn--size-sm" id="resetCam"><i data-icon="rotate"></i><span data-t="resetCam"></span></button>
    </section>

    <section>
      <div class="titleTip"><h2 data-t="position"></h2><span class="helpTip helpTip--wide" tabindex="0"><i data-icon="question-round"></i><span class="tip" role="tooltip"><ul class="keys" id="posKeys"></ul></span></span></div>
      <div class="kds-tabs__list miniSeg" id="scaleMode">
        <button class="kds-tabs__trigger" data-v="rel" data-t="scaleRelS" data-t-aria="scaleRel"></button>
        <button class="kds-tabs__trigger" data-v="abs" data-t="scaleAbsS" data-t-aria="scaleAbs"></button>
      </div>
      <div id="scaleSlider"></div>
      <button class="kds-btn kds-btn--outline kds-btn--size-sm" id="centerBtn"><i data-icon="selection"></i><span data-t="center"></span></button>
    </section>

    <section>
      <h2 data-t="colors"></h2>
      <div class="colorRow"><span class="kds-label" data-t="ring"></span><input type="color" id="ringColor" data-alpha="ringOpacity"><div class="swatches" id="ringSw"></div></div>
      <div class="colorRow"><span class="kds-label" data-t="bg"></span><input type="color" id="bgColor" data-alpha="bgOpacity"><div class="swatches" id="bgSw"></div></div>
      <label class="check"><input type="checkbox" role="switch" class="switch" id="bgOn"><span data-t="bgOn"></span></label>
      <label class="check"><input type="checkbox" role="switch" class="switch" id="gradient"><span data-t="gradientOn"></span></label>
      <div id="gradBox" class="gradBox">
        <div class="swatches grads" id="gradSw"></div>
        <div class="gradStops"><input type="color" id="g0" data-alpha="gradOpacity.0"><input type="color" id="g1" data-alpha="gradOpacity.1"><input type="color" id="g2" data-alpha="gradOpacity.2"></div>
        <div id="angleSlider"></div>
      </div>
    </section>

    <section class="exportSec">
      <div class="secHead"><h2 data-t="export"></h2>
        <span class="helpTip" tabindex="0"><i data-icon="question-round"></i><span class="tip" role="tooltip" id="copyHint"></span></span>
      </div>
      <div class="exportRow">
        <button class="kds-btn kds-btn--default kds-btn--size-lg" id="copyBtn"><i data-icon="copy"></i><span data-t="copy"></span></button>
        <button class="kds-btn kds-btn--outline kds-btn--size-icon-lg" id="downloadBtn" data-t-aria="download"><i data-icon="download"></i></button>
        <button class="kds-btn kds-btn--outline kds-btn--size-icon-lg" id="shareBtn" data-t-aria="share"><i data-icon="link"></i></button>
      </div>
    </section>
  </aside>

  <main class="stage" id="stage">
    <div class="ghost" id="ghost" aria-hidden="true"></div>
    <div class="frame" id="frame"></div>
    <div class="size" id="sizeLabel"></div>
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" data-t-aria="panelWidth" tabindex="0"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="js/app.js?v=__V__"></script>
</body>
</html>
